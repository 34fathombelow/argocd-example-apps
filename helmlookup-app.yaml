apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-helm-lookup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: guestbook
    name: temp
  source:
    path: us
    repoURL: https://github.com/34fathombelow/argocd-example-apps.git
    targetRevision: testing
    plugin:
      name: helm-lookup
      parameters:
        - array:
            - values-production.yaml
          name: values-files
        - map:
            replicaCount: '2'
          name: helm-parameters
      env:
        - name: FOO
          value: bar
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
